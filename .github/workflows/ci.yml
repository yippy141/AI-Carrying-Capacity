name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate app and evidence guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.5'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Python workbook dependency
        run: python3 -m pip install openpyxl==3.1.5

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test evidence logic
        run: npm run test:evidence

      - name: Build
        run: npm run build

      - name: Test adoption-depth validator
        run: python3 -m unittest scripts/validate_adoption_depth_test.py

      - name: Test design-reference placeholder validator
        run: npm run test:design

      - name: Test Structural Profiles worksheet validator
        run: python3 -m unittest scripts/validate_structural_profiles_worksheet_test.py

      - name: Validate Structural Profiles worksheet package
        run: python3 scripts/validate_structural_profiles_worksheet.py

      - name: Validate Structural Profiles reconciliation package
        run: python3 scripts/validate_structural_profiles_reconciliation.py

      - name: Test fusion evidence package
        run: python3 -m unittest scripts/validate_fusion_evidence_test.py

      - name: Test fusion source-promotion and downstream source guards
        run: python3 -m unittest scripts/validate_fusion_source_promotion_test.py

      - name: Validate fusion source promotion
        run: python3 scripts/validate_fusion_source_promotion.py

      - name: Test fusion domain review guardrails
        run: python3 -m unittest scripts/validate_fusion_domain_review_test.py

      - name: Validate fusion domain review package
        run: python3 scripts/validate_fusion_domain_review.py

      - name: Validate fusion evidence package
        run: python3 scripts/validate_fusion_evidence.py

      - name: Validate adoption-depth observations
        run: python3 scripts/validate_adoption_depth.py

      - name: Validate repo scaffold
        run: python3 scripts/validate_repo.py

      - name: Validate source register
        run: python3 scripts/validate_source_register.py

      - name: Validate indicator catalog
        run: python3 scripts/validate_indicator_catalog.py

      - name: Check private-preview readiness
        run: python3 scripts/check_launch_readiness.py --mode private-preview
